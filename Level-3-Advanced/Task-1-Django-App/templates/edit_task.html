<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task - Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .container {
            width: 450px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Edit Task</h1>

    <form method="POST">
        {% csrf_token %}

        <label for="title">Task Title</label>
        <input
            type="text"
            id="title"
            name="title"
            value="{{ task.title }}"
            required
        >

        <label for="description">Description</label>
        <textarea
            id="description"
            name="description"
        >{{ task.description }}</textarea>

        <label for="status">Status</label>
        <select id="status" name="status">

            <option value="pending"
                {% if task.status == "pending" %}selected{% endif %}>
                Pending
            </option>

            <option value="completed"
                {% if task.status == "completed" %}selected{% endif %}>
                Completed
            </option>

        </select>

        <button type="submit">Update Task</button>
    </form>

    <a href="{% url 'dashboard' %}" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
