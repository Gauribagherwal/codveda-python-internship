<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Task - Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 450px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        button {
            padding: 10px 20px;
            background: #cc0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .cancel {
            margin-left: 10px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Delete Task</h2>

    <p>Are you sure you want to delete:</p>

    <strong>{{ task.title }}</strong>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Yes, Delete</button>

        <a href="{% url 'dashboard' %}" class="cancel">
            Cancel
        </a>
    </form>

</div>

</body>
</html>
