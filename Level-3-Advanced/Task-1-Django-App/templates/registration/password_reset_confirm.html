<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 15px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-top: 5px;
        }

        .errorlist {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Set New Password</h2>

    {% if validlink %}

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Change Password</button>
        </form>

    {% else %}

        <p>
            This password reset link is invalid or has already been used.
        </p>

        <a href="{% url 'password_reset' %}">
            Request a new reset link
        </a>

    {% endif %}

</div>

</body>
</html>
